name: Publish to OpenCollab

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: publish-opencollab
  cancel-in-progress: false

permissions:
  contents: read

env:
  # linux and windows are cross compiled on the publishing job, macOS is built on its own runners
  TARGETS: x86_64,aarch64,windows-x86_64,macos-arm64,macos-x86_64

jobs:
  build-macos:
    name: Build macOS Native Libraries
    strategy:
      matrix:
        include:
          - os: macos-26  # Apple Silicon runner
            classifier: macos-arm64
          - os: macos-15-intel  # Intel runner
            classifier: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-tags: 'true'
        fetch-depth: '0'
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install dependencies
      run: |
        brew update
        brew uninstall cmake
        brew install cmake conan
        conan --version

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Build native library for host
      run: ./gradlew compileNativeForHost -Plibdatachannel.build-release-binaries=true

    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      with:
        name: libdatachannel-${{ matrix.classifier }}
        path: |
          build/dockcross/host/native/libdatachannel-java.dylib
        retention-days: 30
        if-no-files-found: error

  publish:
    name: Publish to OpenCollab
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-tags: 'true'
        fetch-depth: '0'
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Download macOS ARM64 artifacts
      uses: actions/download-artifact@v7
      with:
        name: libdatachannel-macos-arm64
        path: artifacts/macos-arm64/

    - name: Download macOS x86_64 artifacts
      uses: actions/download-artifact@v7
      with:
        name: libdatachannel-macos-x86_64
        path: artifacts/macos-x86_64/

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
        df -h /

    - name: Publish
      run: |
        ./gradlew --no-configuration-cache openCollabDeploy \
          -Plibdatachannel.build-release-binaries=true \
          -Plibdatachannel.targets="$TARGETS" \
          -Plibdatachannel.macos-arm64.prebuilt-path=artifacts/macos-arm64/libdatachannel-java.dylib \
          -Plibdatachannel.macos-x86_64.prebuilt-path=artifacts/macos-x86_64/libdatachannel-java.dylib
      env:
        ORG_GRADLE_PROJECT_openCollabSnapshotsUsername: ${{ secrets.OPENCOLLAB_USERNAME }}
        ORG_GRADLE_PROJECT_openCollabSnapshotsPassword: ${{ secrets.OPENCOLLAB_PASSWORD }}
        ORG_GRADLE_PROJECT_openCollabReleasesUsername: ${{ secrets.OPENCOLLAB_USERNAME }}
        ORG_GRADLE_PROJECT_openCollabReleasesPassword: ${{ secrets.OPENCOLLAB_PASSWORD }}
