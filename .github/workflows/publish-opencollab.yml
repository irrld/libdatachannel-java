name: Publish to OpenCollab

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: publish-opencollab
  cancel-in-progress: false

permissions:
  contents: read

env:
  # linux and windows are cross compiled on the publishing job, macOS is built on its own runners
  TARGETS: x86_64,aarch64,windows-x86_64,macos-arm64,macos-x86_64

jobs:
  build-macos:
    name: Build macOS Native Libraries
    strategy:
      matrix:
        include:
          - os: macos-26  # Apple Silicon runner
            classifier: macos-arm64
          - os: macos-15-intel  # Intel runner
            classifier: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-tags: 'true'
        fetch-depth: '0'
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install dependencies
      env:
        HOMEBREW_NO_AUTO_UPDATE: '1'
        HOMEBREW_NO_INSTALL_CLEANUP: '1'
      run: |
        brew uninstall --ignore-dependencies cmake || true
        brew install cmake
        pipx install conan || brew install conan
        cmake --version
        conan --version

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Build native library for host
      run: ./gradlew compileNativeForHost -Plibdatachannel.build-release-binaries=true

    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      with:
        name: libdatachannel-${{ matrix.classifier }}
        path: |
          build/dockcross/host/native/libdatachannel-java.dylib
        retention-days: 30
        if-no-files-found: error

  build-cross:
    name: Cross Compile Native Libraries
    strategy:
      matrix:
        include:
          - classifier: x86_64
            task: compileNativeForX8664
            library: libdatachannel-java.so
          - classifier: aarch64
            task: compileNativeForAarch64
            library: libdatachannel-java.so
          - classifier: windows-x86_64
            task: compileNativeForWindowsX8664
            library: libdatachannel-java.dll
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-tags: 'true'
        fetch-depth: '0'
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Build native library
      run: |
        ./gradlew ${{ matrix.task }} \
          -Plibdatachannel.build-release-binaries=true \
          -Plibdatachannel.targets=${{ matrix.classifier }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      with:
        name: libdatachannel-${{ matrix.classifier }}
        path: build/dockcross/${{ matrix.classifier }}/native/${{ matrix.library }}
        retention-days: 30
        if-no-files-found: error

  publish:
    name: Publish to OpenCollab
    needs: [ build-macos, build-cross ]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-tags: 'true'
        fetch-depth: '0'
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Download native libraries
      uses: actions/download-artifact@v7
      with:
        pattern: libdatachannel-*
        path: artifacts

    - name: Publish
      run: |
        ./gradlew --no-configuration-cache openCollabDeploy \
          -Plibdatachannel.targets="$TARGETS" \
          -Plibdatachannel.x86_64.prebuilt-path=artifacts/libdatachannel-x86_64/libdatachannel-java.so \
          -Plibdatachannel.aarch64.prebuilt-path=artifacts/libdatachannel-aarch64/libdatachannel-java.so \
          -Plibdatachannel.windows-x86_64.prebuilt-path=artifacts/libdatachannel-windows-x86_64/libdatachannel-java.dll \
          -Plibdatachannel.macos-arm64.prebuilt-path=artifacts/libdatachannel-macos-arm64/libdatachannel-java.dylib \
          -Plibdatachannel.macos-x86_64.prebuilt-path=artifacts/libdatachannel-macos-x86_64/libdatachannel-java.dylib
      env:
        ORG_GRADLE_PROJECT_openCollabSnapshotsUsername: ${{ secrets.OPENCOLLAB_USERNAME }}
        ORG_GRADLE_PROJECT_openCollabSnapshotsPassword: ${{ secrets.OPENCOLLAB_PASSWORD }}
        ORG_GRADLE_PROJECT_openCollabReleasesUsername: ${{ secrets.OPENCOLLAB_USERNAME }}
        ORG_GRADLE_PROJECT_openCollabReleasesPassword: ${{ secrets.OPENCOLLAB_PASSWORD }}
